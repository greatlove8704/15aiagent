<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đang tải…</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap home">
  <h1 id="title"></h1>
  <p class="author" id="author"></p>
  <p class="intro" id="intro"></p>
  <hr>
  <ul class="toc" id="list"><li class="loading muted">Đang tải danh sách chương…</li></ul>
</main>

<script type="module">
import { META, getChapters } from "./assets/app.js";

document.title = META.title;
document.getElementById("title").textContent = META.title;
document.getElementById("author").textContent = META.author;
document.getElementById("intro").textContent = META.intro;

const list = document.getElementById("list");
try {
  const chapters = await getChapters();
  if (!chapters.length) {
    list.innerHTML = '<li class="muted">Chưa có chương nào.</li>';
  } else {
    list.innerHTML = chapters.map(c =>
      `<li><a href="chapter.html?c=${encodeURIComponent(c.file)}">` +
      `<span class="num">${c.num}</span><span class="title">${c.title}</span></a></li>`
    ).join("");
  }
} catch (e) {
  list.innerHTML = `<li class="muted">Không tải được danh sách chương. ${e.message}</li>`;
}
</script>
</body>
</html>
